name: Desktop macOS

on:
  workflow_dispatch:
  push:
    tags:
      - 'desktop-v*'

permissions:
  contents: read

concurrency:
  group: desktop-macos-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-14
          - arch: x64
            runner: macos-15-intel
    env:
      TARGET_ARCH: ${{ matrix.arch }}
      # The packaging scripts read their public release identifiers from
      # DSH_DESKTOP_* names. The app id is a public constant; the signing
      # identity and team id are derived from the imported certificate in the
      # keychain step below, so they cannot drift from it. CSC_* is
      # electron-builder's own import of that same certificate.
      DSH_DESKTOP_APP_ID: ${{ vars.DESKTOP_APP_ID || 'com.deepseek.harness' }}
      # This fork ships its own desktop build, so electron-updater must not
      # follow the upstream release stream: installing an upstream release
      # would replace the packaged seed and drop every fork-only package.
      # Point the updater at a deployment-owned origin that serves nothing
      # today; the check fails silently and no upstream build is ever
      # offered. Set the DESKTOP_UPDATE_ORIGIN repository variable once an
      # internal update feed exists.
      DOWNLOAD_TEST_ORIGIN: ${{ vars.DESKTOP_UPDATE_ORIGIN || 'https://desktop-updates.internal.invalid' }}
      CSC_LINK: ${{ secrets.MAC_CERTIFICATE_P12_BASE64 }}
      CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Require signing and notarization secrets
        shell: bash
        run: |
          set -euo pipefail
          # DSH_DESKTOP_MACOS_SIGNING_IDENTITY and DSH_DESKTOP_MACOS_TEAM_ID are
          # derived from the imported certificate, so only the inputs below are
          # required here.
          for variable in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [[ -z "${!variable:-}" ]]; then
              echo "::error::Required GitHub Actions secret for ${variable} is missing."
              exit 1
            fi
          done

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Import the signing certificate
        shell: bash
        run: |
          set -euo pipefail
          # prepare:seed codesigns the packaged pnpm store before
          # electron-builder runs, so the Developer ID certificate must be in
          # the keychain before the packaging command starts. The packaging
          # scripts read the identity and team from DSH_DESKTOP_* names; both
          # are derived from the imported certificate so no separate secret
          # can drift from the certificate actually used.
          keychain="${RUNNER_TEMP}/dsh-signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          echo "${CSC_LINK}" | base64 --decode > "${RUNNER_TEMP}/signing.p12"
          security create-keychain -p "${keychain_password}" "${keychain}"
          security set-keychain-settings -lut 21600 "${keychain}"
          security unlock-keychain -p "${keychain_password}" "${keychain}"
          security import "${RUNNER_TEMP}/signing.p12" -k "${keychain}" \
            -P "${CSC_KEY_PASSWORD}" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "${keychain_password}" "${keychain}" > /dev/null
          security list-keychains -d user -s "${keychain}" login.keychain-db
          rm -f "${RUNNER_TEMP}/signing.p12"

          # `codesign --sign` takes the certificate's common name without the
          # "Developer ID Application: " prefix; the packaging scripts reject
          # that prefix when it is present.
          identity="$(security find-identity -v -p codesigning "${keychain}" \
            | sed -n 's/.*"\(Developer ID Application: .*\)"/\1/p' | head -n 1)"
          if [[ -z "${identity}" ]]; then
            echo "::error::The imported certificate carries no Developer ID Application identity."
            exit 1
          fi
          identity="${identity#Developer ID Application: }"

          # The Team ID is the certificate subject's OU component.
          team_id="$(security find-certificate -c "${identity}" -p "${keychain}" \
            | openssl x509 -noout -subject \
            | sed -n 's/.*OU *= *\([A-Z0-9]*\).*/\1/p' | head -n 1)"
          if [[ ! "${team_id}" =~ ^[A-Z0-9]{10}$ ]]; then
            echo "::error::Could not read a 10-character Team ID from the certificate subject."
            exit 1
          fi

          {
            echo "DSH_DESKTOP_MACOS_SIGNING_IDENTITY=${identity}"
            echo "DSH_DESKTOP_MACOS_TEAM_ID=${team_id}"
          } >> "${GITHUB_ENV}"
          echo "Signing as ${identity} (team ${team_id})"
          security find-identity -v -p codesigning "${keychain}"

      - name: Build and verify runtime closure
        run: |
          pnpm run build
          pnpm run verify-runtime-closure

      - name: Package architecture-specific DMG
        run: pnpm --filter @deepseek-ai/dsh-desktop run "package:mac:${TARGET_ARCH}"

      - name: Verify the signed and notarized DMG
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          # electron-builder writes under the target's build root and notarizes
          # the disk image through the repository's own afterSign hook.
          artifacts="apps/desktop/.desktop-build/targets/mac-${TARGET_ARCH}/artifacts"
          dmgs=("${artifacts}"/*-mac-"${TARGET_ARCH}".dmg)
          if [[ ${#dmgs[@]} -ne 1 ]]; then
            echo "::error::Expected one ${TARGET_ARCH} DMG in ${artifacts}, found ${#dmgs[@]}."
            exit 1
          fi
          dmg="${dmgs[0]}"

          # The packaging hook notarized and stapled this image; verify that
          # result rather than submitting it a second time.
          xcrun stapler validate "${dmg}"
          spctl --assess --type open --context context:primary-signature --verbose=4 "${dmg}"

          mount_dir="${RUNNER_TEMP}/deepseek-harness-${TARGET_ARCH}"
          mkdir -p "${mount_dir}"
          hdiutil attach "${dmg}" -nobrowse -readonly -mountpoint "${mount_dir}"
          trap 'hdiutil detach "${mount_dir}" >/dev/null || true' EXIT
          app_bundle="$(find "${mount_dir}" -maxdepth 1 -type d -name '*.app' -print -quit)"
          if [[ -z "${app_bundle}" ]]; then
            echo "::error::The DMG does not contain an application bundle."
            exit 1
          fi
          codesign --verify --deep --strict --verbose=2 "${app_bundle}"
          spctl --assess --type execute --verbose=4 "${app_bundle}"
          xcrun stapler validate "${app_bundle}"
          hdiutil detach "${mount_dir}"
          trap - EXIT

          checksum="${dmg}.sha256"
          shasum -a 256 "${dmg}" > "${checksum}"
          echo "dmg=${dmg}" >> "${GITHUB_OUTPUT}"
          echo "checksum=${checksum}" >> "${GITHUB_OUTPUT}"

      - name: Upload signed installer
        uses: actions/upload-artifact@v4
        with:
          name: deepseek-harness-macos-${{ matrix.arch }}
          path: |
            ${{ steps.verify.outputs.dmg }}
            ${{ steps.verify.outputs.checksum }}
          if-no-files-found: error
          retention-days: 14
