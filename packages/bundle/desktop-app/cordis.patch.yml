# Desktop application layer over dsh-base + dsh-web-app. The Electron main
# process owns window lifecycle while the existing Web UI stays the one client.

- id: webserver
  config:
    host: 127.0.0.1
    port: 0

- id: web-runtime
  config:
    printUrl: false
    openBrowser: false
    surfaceContext: false
    trustedHosts: []

- id: connection
  config:
    trustedHosts: []

- id: client-hmr
  disabled: true

# This deployment's model routes accept larger sources than the shared
# default admits: CodeBuddy and the DeepSeek vision routes take a 16384px
# side, so raise the per-side admission bound here instead of shipping a
# patched constant. The total decoded-pixel bound above it still applies.
- id: attachment-local
  config:
    maxImageDimension: 16384

- id: agent-default-model
  config:
    provider: tencent-internal
    model: gpt-5.6-sol

# A first-run user is onboarded into this deployment's own route, so the
# onboarding step offers the CodeBuddy key field rather than the official one.
- id: ui-settings-models
  config:
    preferredProvider: tencent-internal

# The browser tool suite drives one persistent local Chromium. This layer owns
# the row because upstream's base and web-app bundles carry no browser row.
- insert:
    - id: browser
      name: '@deepseek-ai/dsh-browser'

    # The live preview overlay sits beside the tool suite: a Host RPC surface
    # plus the `shell.overlay` occupant that renders the model-driven page.
    - id: browser-popup
      name: '@deepseek-ai/dsh-browser-popup'

    # Persistent MCP server definitions. Each enabled row mounts one mcp-client
    # fiber and publishes its discovered tools; the Settings page below edits
    # the document through the manager's Remote.
    - id: mcp-manager
      name: '@deepseek-ai/dsh-mcp-manager'

    - id: ui-settings-mcp
      name: '@deepseek-ai/dsh-client-ui-settings-mcp'

    # The Skills Settings section over the session skill catalog. Upstream's
    # ui-skill owns the chat picker only, so this row owns the management page.
    - id: ui-settings-skill
      name: '@deepseek-ai/dsh-client-ui-settings-skill'

    # This deployment's own whale mark and product name. The official occupant
    # registers at the default priority; this one registers below it and wins
    # the single-slot election, so upstream artwork and the shared locale
    # dictionaries stay untouched.
    - id: ui-brand-desktop
      name: '@deepseek-ai/dsh-client-ui-brand-desktop'

    # The user skills directory the Skills settings page reveals and opens.
    - id: skill-directory
      name: '@deepseek-ai/dsh-skill-directory'

    - id: llm-tencent-codebuddy
      name: '@deepseek-ai/dsh-llm-tencent-codebuddy'
